# cargo-deny configuration — runs daily + on every push/PR via
# .github/workflows/deny.yml. Local invocation:
#
#   cargo install cargo-deny    # one-shot
#   cargo deny check
#
# The four subcommands we run are `advisories`, `bans`, `licenses`,
# `sources`. See https://embarkstudios.github.io/cargo-deny/ for the
# schema reference.

[advisories]
version = 2
# RustSec advisories: any reported vulnerability fails the run.
# Unmaintained / unsound crates are warned-on (default in v2).
ignore = [
    # paste is unmaintained but has no safe drop-in replacement; it is
    # pulled transitively by parquet v53 (via arrow / arrow-array).
    # We accept the risk until parquet drops the dependency.
    { id = "RUSTSEC-2024-0436", reason = "transitive via parquet v53; no upstream replacement available" },
]

[licenses]
version = 2
# Standard permissive licenses for an Apache-2.0 OSS project.
# Reject anything not on this allow-list (no GPL, no AGPL, etc.).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # CC0-1.0 is a public-domain dedication; functionally compatible
    # with our Apache-2.0 license posture. Pulled in by e.g. `notify`
    # / `tiny-keccak`-style transitive deps.
    "CC0-1.0",
    # 0BSD ("zero-clause BSD") is OSI-approved permissive; equivalent
    # to a no-attribution version of BSD-2-Clause. Pulled in by
    # `quoted_printable` (transitive of `lettre`).
    "0BSD",
]
confidence-threshold = 0.93
exceptions = []

# Skip licence checks for our own workspace crates. All OpenDQI
# crates ship with `publish = false` and from v0.19.0 carry
# `license = "LicenseRef-FSL-1.1-Apache-2.0"`, which is not on
# the SPDX licence list (FSL is source-available, not OSI-
# approved). The licence-file alongside (LICENSE.md) is the
# canonical text; external consumers see it directly. The allow
# list above governs only third-party dependencies.
private = { ignore = true }

[bans]
# The arrow / parquet / tokio ecosystems carry legitimate duplicate
# versions (e.g. hashbrown 0.14 alongside 0.15) that we can't easily
# arbitrate. Warn so we notice growth, but don't block.
multiple-versions = "warn"
# No wildcard versions allowed in our Cargo.toml — discipline.
wildcards = "deny"
# Workspace-internal path deps (e.g. `opendqi-core = { path = ".." }`)
# are technically version="*" but resolve through the workspace and
# are never published as wildcards. Allow them; still deny wildcards
# on external crates.
allow-wildcard-paths = true
# Show full dependency tree on hits.
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
