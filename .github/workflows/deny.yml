name: deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily audit catches new RustSec advisories without needing a push.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          log-level: warn
          arguments: --all-features
