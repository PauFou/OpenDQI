name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

  msrv:
    name: MSRV (1.87.0)
    runs-on: ubuntu-latest
    env:
      # MSRV is a *compilation* guarantee, not a lint guarantee —
      # older rustc may emit different warnings. Override the
      # workflow-global `-D warnings` for this job only.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        # Pin the action ref to the exact MSRV (1.87.0) instead
        # of @master + explicit `toolchain:` field — fewer
        # floating moving parts. Must stay in sync with
        # `rust-version` in Cargo.toml.
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-

      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets --locked
