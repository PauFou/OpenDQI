[package]
name = "opendqi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenDQI command-line interface."
publish = false

[[bin]]
name = "opendqi"
path = "src/main.rs"

[dependencies]
opendqi-core = { path = "../opendqi-core" }
opendqi-io = { path = "../opendqi-io" }
opendqi-report = { path = "../opendqi-report" }
opendqi-server = { path = "../opendqi-server" }
opendqi-store = { path = "../opendqi-store" }
opendqi-xml = { path = "../opendqi-xml" }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
chrono.workspace = true
csv.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Opt-in heap profiler (Milestone 0.18). Optional + feature-gated:
# absent from every default / release / CI build, so behaviour and
# all committed artifacts are byte-identical. Deliberate one-shot
# allocation attribution only — never shipped, never in preflight/CI.
dhat = { version = "0.3", optional = true }

[features]
# `cargo run --release -p opendqi-cli --features dhat-heap` swaps in
# the dhat global allocator + heap profiler (writes dhat-heap.json).
dhat-heap = ["dep:dhat"]
