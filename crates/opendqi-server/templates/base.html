<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1d1d1f;
    --muted: #6b6b6b;
    --accent: #0a5cab;
    --border: #d8d8d8;
    --critical: #b00020;
    --high: #cc6a00;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
    line-height: 1.5;
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
  }
  header p {
    margin: 0 0 2rem;
    color: var(--muted);
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
  }
  label {
    display: block;
    margin-top: 1rem;
    font-weight: 600;
  }
  input[type=file], select {
    display: block;
    margin-top: 0.4rem;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    background: white;
  }
  button {
    margin-top: 1.5rem;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); }
  .pill {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .pill.critical { background: #fde2e2; color: var(--critical); }
  .pill.high { background: #fff0d6; color: var(--high); }
  .score { font-size: 2rem; font-weight: 700; }
  ul.downloads { list-style: none; padding: 0; }
  ul.downloads li { padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
  ul.downloads li:last-child { border-bottom: none; }
  footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body class="{{ body_class }}">
<header>
  <h1>OpenDQI desktop</h1>
  <p>Local-first data-quality scans for EMIR / SFTR reporting files.</p>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>OpenDQI — local-first regulatory data-quality engine.</footer>
</body>
</html>
