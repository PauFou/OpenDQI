# OpenDQI mapping for the synthetic SFTR internal-book CSV.
#
# Keys are canonical SFTR record field names; values are the header
# names found in the book CSV. Only the fields needed for
# `sftr book-reconcile` cross-source comparison are listed.

fields:
  uti: trade_uti
  sft_type: sft_type
  counterparty_1: reporting_cpty
  counterparty_2: other_cpty
  loan_value: loan
  loan_currency: loan_ccy
  collateral_value: collateral
  collateral_currency: coll_ccy
  haircut: haircut
  maturity_date: maturity
  reuse_indicator: reuse
  settlement_date: settlement
  collateral_portfolio_code: portfolio
  collateral_isin: collateral_isin
  termination_date: status

date_format: "%Y-%m-%d"
datetime_format: "%Y-%m-%dT%H:%M:%S%.fZ"
