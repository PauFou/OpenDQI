[workspace]
resolver = "2"
members = [
    "crates/opendqi-core",
    "crates/opendqi-io",
    "crates/opendqi-report",
    "crates/opendqi-xml",
    "crates/opendqi-store",
    "crates/opendqi-server",
    "crates/opendqi-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/PauFou/OpenDQI"
authors = ["OpenDQI contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
minijinja = "2.5"
quick-xml = "0.36"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "tokio1-rustls-tls", "hostname"] }
clap_complete = "4"
clap_mangen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
